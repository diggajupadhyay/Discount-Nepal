<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Discount Nepal — Open Graph share card (source)</title>
<!--
  Source for assets/og.png (1200x630, the image shown when the site link is
  shared on WhatsApp, X, Discord, Facebook, Slack, …).

  Regenerate with:
    google-chrome --headless=new --disable-gpu --no-sandbox --hide-scrollbars \
      --window-size=1200,630 --screenshot=assets/og.png \
      assets/og-card.html
-->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:linear-gradient(135deg,#1e3a8a 0%,#2563eb 58%,#3b82f6 100%);
  color:#fff;position:relative;
}
/* soft decorative circles */
.blob{position:absolute;border-radius:50%;background:rgba(255,255,255,.07)}
.blob.b1{width:520px;height:520px;right:-140px;top:-180px}
.blob.b2{width:360px;height:360px;left:-120px;bottom:-160px}

.left{position:absolute;left:72px;top:64px;width:620px}
.logo{
  width:104px;height:104px;border-radius:26px;background:#fff;color:#2563eb;
  display:flex;align-items:center;justify-content:center;
  font-size:38px;font-weight:800;letter-spacing:-.03em;
  box-shadow:0 14px 34px rgba(15,23,42,.28);margin-bottom:30px;
}
h1{font-size:66px;line-height:1.04;letter-spacing:-.025em;margin-bottom:20px}
.tagline{font-size:26px;line-height:1.45;color:rgba(255,255,255,.9);margin-bottom:32px;max-width:600px}
.chips{display:flex;gap:12px;margin-bottom:34px}
.chip{
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);
  padding:11px 22px;border-radius:999px;font-size:19px;font-weight:600;
}
.url{font-size:19px;color:rgba(255,255,255,.78);letter-spacing:.01em}

/* mock product cards on the right */
.mini{
  position:absolute;width:296px;background:#fff;color:#111827;
  border-radius:20px;padding:14px;
  box-shadow:0 28px 60px rgba(15,23,42,.4);
}
.mini.m1{right:132px;top:40px;transform:rotate(-4deg)}
.mini.m2{right:14px;top:336px;transform:rotate(3.5deg)}
.shot{position:relative;height:158px;border-radius:14px;overflow:hidden}
.m1 .shot{background:linear-gradient(150deg,#e5e7eb 0%,#cbd5e1 55%,#94a3b8 100%)}
.m2 .shot{background:linear-gradient(150deg,#d6d3d1 0%,#a8a29e 60%,#78716c 100%)}
.badge{
  position:absolute;right:12px;top:12px;background:#dc2626;color:#fff;
  font-size:19px;font-weight:800;padding:7px 13px;border-radius:999px;
  box-shadow:0 6px 16px rgba(220,38,38,.4);
}
.name{font-size:19px;font-weight:700;margin:14px 4px 8px;line-height:1.3}
.prices{display:flex;align-items:baseline;gap:12px;margin:0 4px 6px}
.sale{color:#dc2626;font-size:24px;font-weight:800}
.was{color:#9ca3af;font-size:19px;text-decoration:line-through}
</style>
</head>
<body>
  <div class="blob b1"></div>
  <div class="blob b2"></div>

  <div class="left">
    <div class="logo">25%</div>
    <h1>Discount Nepal</h1>
    <p class="tagline">Live prices on discounted outdoor, trekking &amp; streetwear gear from Nepali online stores.</p>
    <div class="chips">
      <span class="chip">Outdoor</span>
      <span class="chip">Trekking</span>
      <span class="chip">Streetwear</span>
    </div>
    <div class="url">diggajupadhyay.github.io/Discount-Nepal</div>
  </div>

  <div class="mini m1">
    <div class="shot"><span class="badge">&minus;30%</span></div>
    <div class="name">Waffle Hoodie — Blue</div>
    <div class="prices"><span class="sale">Rs 1,500</span><span class="was">Rs 3,350</span></div>
  </div>

  <div class="mini m2">
    <div class="shot"><span class="badge">&minus;45%</span></div>
    <div class="name">Trekking Jacket — Olive</div>
    <div class="prices"><span class="sale">Rs 2,400</span><span class="was">Rs 4,800</span></div>
  </div>
</body>
</html>
